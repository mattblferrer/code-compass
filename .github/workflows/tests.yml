# Runs the whole test suite twice on every push to main and every pull request: once in
# local mode (SQLite) and once in hosted mode against a PostgreSQL server made for the run,
# as `pytest` with CODECOMPASS_TEST_PG does on a laptop (README). Tests never call real sites.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch replaces a run still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local:
    name: Local mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  hosted:
    name: Hosted mode
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # The same server as the README's test database.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_INITDB_ARGS: --locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CODECOMPASS_TEST_PG: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
