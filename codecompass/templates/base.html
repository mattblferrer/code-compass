<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CodeCompass{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pico.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  </head>
  <body>
    <header class="container">
      <nav>
        <ul>
          <li><a href="{{ url_for('main.dashboard') }}"><strong>CodeCompass</strong></a></li>
        </ul>
        <ul>
          <li><a href="{{ url_for('main.log_attempt') }}">Log</a></li>
          <li><a href="{{ url_for('main.history') }}">History</a></li>
        </ul>
      </nav>
    </header>
    <main class="container">
      {% with messages = get_flashed_messages() %}
        {% for message in messages %}
          <p class="flash" role="status">{{ message }}</p>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
  </body>
</html>
